[project]
name = "industrial-video-workspace"
version = "0.1.0"
description = "Local video tracking and grounded chat"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.18",
  "ultralytics>=8.4",
  "transformers>=4.45,<5",
  "peft>=0.14",
  "lap>=0.5.12",
  "torch>=2.7",
  "torchvision>=0.22",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "vision", "chat", "runtime", "setup_models", "fine_tune_chat", "detector_training", "prompt_tracking", "corrections", "video_finetune"]

[tool.setuptools.data-files]
"share/industrial-video-workspace" = ["index.html", "dashboard.js"]
"share/industrial-video-workspace/assets" = ["assets/dashboard.css", "assets/THIRD_PARTY_LICENSES.txt"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = ["httpx>=0.28", "ruff>=0.12", "ty>=0.0.1", "build>=1.2"]
