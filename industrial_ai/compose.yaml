services:
  app:
    build:
      context: ..
      dockerfile: industrial_ai/Dockerfile
    restart: unless-stopped
    environment:
      INSIGHT_PUBLIC_URL: "${INSIGHT_PUBLIC_URL:-https://localhost}"
      INSIGHT_HOSTS: "${INSIGHT_HOSTS:-127.0.0.1,localhost,[::1]}"
    expose: [8765]
    read_only: true
    mem_limit: "${INSIGHT_MEMORY_LIMIT:-8g}"
    cpus: "${INSIGHT_CPU_LIMIT:-4}"
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /workspace/industrial_ai/.tmp:uid=10001,gid=10001,mode=0700
    volumes:
      - data:/workspace/industrial_ai/data
      - models:/workspace/industrial_ai/models
      - cache:/workspace/industrial_ai/.cache
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:443:443"
      - "${PUBLIC_BIND:-127.0.0.1}:80:80"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
volumes:
  data:
  models:
  cache:
  caddy_data:
  caddy_config:
